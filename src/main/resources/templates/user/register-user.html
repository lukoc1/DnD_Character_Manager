<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>DnD Character Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>
<body>

<!-- TOP NAVBAR -->
<nav class="navbar navbar-light mb-2" style="background-color: #B0BE00;" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand text-black" th:href="@{/login}">DnD Character Manager</a>
    </div>
</nav>

<div class="container">

    <div class="d-flex justify-content-between align-items-right mb-3">
        <h1 class="h3 m-0">New user</h1>
    </div>

    <form th:action="@{/user/register}" th:object="${registerUserDTO}" method="post">

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" th:field="*{name}"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" th:field="*{password}"/>
        </div>

        <button type="submit" name="register" class="btn btn-primary">Register</button>
        <button type="submit" name="cancel" class="btn btn-primary">Cancel</button>

    </form>

</div>

</body>
</html>
