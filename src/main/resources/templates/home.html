<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DnD Character Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>

<!-- TOP NAVBAR -->
<nav th:replace="fragments/header :: header"></nav>

<div class="container">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 m-0" th:text="${user.firstName} + ' ' + ${user.lastName} + ' - Character list'">Character list</h1>

    <div>
      <a class="btn btn-success" th:href="@{/avatar/create}">
        <i class="bi bi-plus-lg"></i> New avatar
      </a>

      <a class="btn btn-outline-primary" th:href="@{/user/edit}">
        <i class="bi bi-pencil"></i> Edit profile
      </a>
      <form th:action="@{/logout}" method="post" style="display:inline">
        <button type="submit" class="btn btn-outline-secondary">Logout</button>
      </form>
      <form th:action="@{/user/delete}" method="post" style="display:inline">
        <button type="submit" class="btn btn-outline-danger data-confirm">Delete account</button>
      </form>
    </div>

  </div>

  <div th:if="${message}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${message}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Zamknij"></button>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Overview</th>

        <th class="text-end">Actions</th>
      </tr>
      </thead>
      <tbody>

      <tr th:each="a : ${avatars}">
        <td th:text="${a.id}">1</td>
        <td th:text="${a.name}">Nazwa</td>
        <td th:text="${a.className} + ' - ' + ${a.specieName} + ' - ' + ${a.backgroundName}"></td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-primary" th:href="@{|/avatar/select/${a.id}|}">Choose</a>

          <a class="btn btn-sm btn-outline-primary data-confirm" th:href="@{|/avatar/delete/${a.id}|}">Delete</a>
        </td>

      </tr>
      </tbody>
    </table>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/modal.js}"></script>
</body>
</html>
