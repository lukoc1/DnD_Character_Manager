<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DnD Character Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<!-- TOP NAVBAR -->
<nav class="navbar navbar-light mb-2" style="background-color: #B0BE00;" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand text-black">DnD Character Manager</a>
  </div>
</nav>

<div class="container">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 m-0">Lista postaci</h1>

    <div>
      <a class="btn btn-success" th:href="@{/avatar/add}">
        <i class="bi bi-plus-lg"></i> Dodaj nowy
      </a>
      <form th:action="@{/logout}" method="post" style="display:inline">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="btn btn-outline-secondary">Wyloguj</button>
      </form>
    </div>

  </div>

  <div th:if="${message}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${message}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Zamknij"></button>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-light">
      <tr>
        <th>ID</th>
        <th>Nazwa</th>
        <th>Opis</th>

        <th class="text-end">Akcje</th>
      </tr>
      </thead>
      <tbody>

      <tr th:each="a : ${avatars}">
        <td th:text="${a.id}">1</td>
        <td th:text="${a.name}">Nazwa</td>
        <td th:text="placeholder"></td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-primary" th:href="@{|/avatar/select/${a.id}|}">Choose</a>

          <!-- Triggers confirmation modal -->
          <a class="btn btn-sm btn-outline-primary data-confirm" th:href="@{|/avatar/delete/${a.id}|}">Delete</a>
        </td>

      </tr>
      </tbody>
    </table>
  </div>
