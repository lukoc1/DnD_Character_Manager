<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Error - DnD CM</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

</head>

<body>

<!-- TOP NAVBAR -->
<nav class="navbar navbar-light mb-2" style="background-color: #B0BE00;" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand text-black">DnD Character Manager</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card bg-secondary text-white border-danger mx-auto" style="max-width: 500px;">

        <div class="card-header bg-danger text-white">
            <h4 class="m-0">Wystąpił błąd</h4>
        </div>

        <div class="card-body">
            <p
                    class="text-muted small" th:text="${#temporals.format(timestamp, 'dd-MM-yyyy HH:mm:ss')}">
            </p>

            <p
                    class="card-text fs-5" th:text="${errorMessage}">Error message
            </p>

            <p
                    class="text-warning mb-0">Error code: <strong th:text="${errorCode}">CODE</strong>
            </p>
        </div>

        <div class="card-footer text-end">
            <a th:href="@{/}" class="btn btn-light">Back to home page</a>
        </div>

    </div>
</div>

</body>
</html>
