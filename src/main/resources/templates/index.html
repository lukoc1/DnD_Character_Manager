<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login page</title>
  <link th:href="@{/default-ui.css}" rel="stylesheet" />
</head>
<body>
<div class="content">
  <form class="login-form" th:action="@{/login}" method="post">
    <h2>Please sign in</h2>

    <p th:if="${loginError}" class="error">Wrong username or password</p>

    <p>
      <label for="username" class="screenreader">Username</label>
      <input type="text" id="username" name="username" placeholder="Username" required autofocus />
    </p>
    <p>
      <label for="password" class="screenreader">Password</label>
      <input type="password" id="password" name="password" placeholder="Password" required />
    </p>

    <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}" />
    <button type="submit" class="primary">Sign in</button>
  </form>

  <p>
    <a th:href="@{/user/adduser}">Register new user</a>
  </p>

</div>
</body>
</html>
