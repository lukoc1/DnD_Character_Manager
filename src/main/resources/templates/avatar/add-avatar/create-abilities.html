<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>DnD Character Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<!-- TOP NAVBAR -->
<nav th:replace="fragments/header :: header"></nav>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 m-0">
            <span th:text="${avatar.name}">Hero</span> - Ability scores
        </h1>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">error</div>

    <p class="text-secondary">
        Roll four d6 and keep the highest three. Do this six times, then assign each result to an ability.
    </p>

    <form th:action="@{/avatar/{id}/create/abilities(id=${avatar.id})}" method="post" id="abilities-form">

        <div class="border border-2 border-dark rounded-3 p-3 mb-3">

            <div class="d-flex align-items-center gap-3 mb-3">
                <button type="button" class="btn btn-dark" id="roll-btn">Roll</button>
                <span class="text-secondary">Rolled: <span id="rolled-pool" class="fw-bold">-</span></span>
            </div>

            <div class="row g-2">
                <div class="col-md-4" th:each="ability : ${ {'str','dex','con','int','wis','cha'} }">
                    <label class="small text-uppercase text-secondary" th:for="${ability}"
                           th:text="${ability}">str</label>
                    <select class="form-select ability-select" th:name="${ability}" th:id="${ability}" required>
                        <option value="">-</option>
                    </select>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" id="submit-btn" disabled>Next</button>
    </form>

</div>

<script th:src="@{/js/create-abilities.js}"></script>

</body>
</html>
