<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>DnD Character Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<!-- TOP NAVBAR -->
<nav th:replace="fragments/header :: header"></nav>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 m-0">
            <span th:text="${avatar.name}">Hero</span> - Level up
        </h1>
    </div>

    <div class="content-center border border-2 border-dark rounded-3 p-3 mb-3"
         th:with="minGain=1, maxGain=${avatar.hitDieSize + avatar.consMod > 1 ? avatar.hitDieSize + avatar.consMod : 1}">

        <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
            <span class="text-uppercase small text-secondary">Level</span>
            <span><strong th:text="${avatar.level}">1</strong> -> <strong th:text="${avatar.level + 1}">2</strong></span>
        </div>

        <div class="d-flex justify-content-between">
            <span class="text-uppercase small text-secondary">Max HP</span>
            <span>
                <strong th:text="${avatar.maxHP}">10</strong> ->
                <strong th:text="|${avatar.maxHP + minGain} - ${avatar.maxHP + maxGain}|">11 - 16</strong>
            </span>
        </div>

        <p class="text-secondary small mb-0 mt-2">
            Roll: 1d<span th:text="${avatar.hitDieSize}">8</span> + Constitution modifier
            (<span th:text="${avatar.consMod}">1</span>), minimum 1 HP gained.
        </p>
    </div>

    <form th:action="@{/avatar/{id}/level-up(id=${avatar.id})}" method="post">
        <button type="submit" class="btn btn-success">Confirm level up</button>
        <a class="btn btn-outline-secondary" th:href="@{|/avatar/select/${avatar.id}/showcard|}">Cancel</a>
    </form>

</div>

</body>
</html>
