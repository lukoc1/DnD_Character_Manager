<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>DnD Character Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<!-- TOP NAVBAR -->
<nav th:replace="fragments/header :: header"></nav>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 m-0">
            <span th:text="${avatar.name}">Hero</span> -
            <span th:text="${dndClass.name}">Barbarian</span>
        </h1>
    </div>

    <form th:action="@{/avatar/{id}/create/class(id=${avatar.id})}" method="post">

        <!-- what the class gives -->
        <div class="border border-2 border-dark rounded-3 p-3 mb-3">
            <div class="row g-2">
                <div class="col-md-4">
                    <div class="small text-uppercase text-secondary">Hit point die</div>
                    <div class="fw-bold" th:text="'D' + ${dndClass.hitDiceValue} + ' per ' + ${dndClass.name} + ' level'">D12 per Barbarian level</div>
                </div>
                <div class="col-md-4">
                    <div class="small text-uppercase text-secondary">Saving throw proficiencies</div>
                    <div class="fw-bold" th:text="${savingThrows}">Strength, Constitution</div>
                </div>
                <div class="col-md-4">
                    <div class="small text-uppercase text-secondary">Weapon proficiencies</div>
                    <div class="fw-bold" th:text="${dndClass.weaponProficiencies}">Simple and Martial weapons</div>
                </div>
                <div class="col-md-4">
                    <div class="small text-uppercase text-secondary">Armor training</div>
                    <div class="fw-bold" th:text="${dndClass.armorTraining}">Light and Medium armor and Shields</div>
                </div>
            </div>
        </div>

        <!-- skill proficiencies -->
        <div class="border border-2 border-dark rounded-3 p-3 mb-3">
            <div class="small text-uppercase text-secondary mb-2">
                Skill proficiencies - choose <span th:text="${dndClass.skillChoiceCount}">2</span>
            </div>

            <div class="small text-danger mb-2" th:if="${error}" th:text="${error}">error</div>

            <div class="row">
                <div class="col-md-4" th:each="s : ${dndClass.skillOptions}">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="skills"
                               th:value="${s.name}" th:id="${'skill-' + s.id}"/>
                        <label class="form-check-label" th:for="${'skill-' + s.id}" th:text="${s.name}">Athletics</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- starting equipment (choose A or B) -->
        <div class="border border-2 border-dark rounded-3 p-3 mb-3">
            <div class="small text-uppercase text-secondary mb-2">Starting equipment</div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="equipment" value="A" id="start-eq-a" checked/>
                <label class="form-check-label" for="start-eq-a">
                    <strong>A.</strong>
                    <span th:text="${dndClass.startingEquipmentA}">Greataxe</span>
                </label>
            </div>
            <div class="form-check" th:if="${dndClass.startingEquipmentB != null}">
                <input class="form-check-input" type="radio" name="equipment" value="B" id="start-eq-b"/>
                <label class="form-check-label" for="start-eq-b">
                    <strong>B.</strong>
                    <span th:text="${dndClass.startingEquipmentB}">75 GP</span>
                </label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Next</button>

    </form>

</div>

</body>
</html>
