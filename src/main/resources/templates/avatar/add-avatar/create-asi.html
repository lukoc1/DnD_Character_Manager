<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>DnD Character Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<!-- TOP NAVBAR -->
<nav th:replace="fragments/header :: header"></nav>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 m-0">
            <span th:text="${avatar.name}">Hero</span> - Ability Score Improvement
        </h1>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">error</div>

    <p class="text-secondary">
        This level up grants increase of one ability score by 2, or two ability scores by 1 each. No score can go above 20.
    </p>

    <form th:action="@{/avatar/{id}/level-up/asi(id=${avatar.id})}" method="post">

        <div class="border border-2 border-dark rounded-3 p-3 mb-3"
             th:with="abilities=${ {'Strength','Dexterity','Constitution','Intelligence','Wisdom','Charisma'} }">

            <div class="form-check">
                <input class="form-check-input" type="radio" name="mode" value="single" id="mode-single" checked/>
                <label class="form-check-label" for="mode-single">Raise one ability by +2</label>
            </div>
            <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="mode" value="double" id="mode-double"/>
                <label class="form-check-label" for="mode-double">Raise two abilities by +1 each</label>
            </div>

            <div class="row g-2 ps-4">
                <div class="col-sm-6">
                    <label class="small text-secondary" for="ability1">Ability 1</label>
                    <select class="form-select" name="ability1" id="ability1" required>
                        <option value="">-</option>
                        <option th:each="a : ${abilities}" th:value="${a}" th:text="${a}">Strength</option>
                    </select>
                </div>
                <div class="col-sm-6">
                    <label class="small text-secondary" for="ability2">Ability 2</label>
                    <select class="form-select" name="ability2" id="ability2" required>
                        <option value="">-</option>
                        <option th:each="a : ${abilities}" th:value="${a}" th:text="${a}">Wisdom</option>
                    </select>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Confirm</button>

    </form>

</div>

<script th:src="@{/js/create-asi.js}"></script>

</body>
</html>
