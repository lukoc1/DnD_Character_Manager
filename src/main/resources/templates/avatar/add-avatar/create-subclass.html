<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>DnD Character Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<nav th:replace="fragments/header :: header"></nav>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 m-0">
            <span th:text="${avatar.name}">Hero</span> - Choose a subclass
        </h1>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">error</div>

    <form th:action="@{/avatar/{id}/level-up/subclass(id=${avatar.id})}" method="post">

        <div class="border border-2 border-dark rounded-3 p-3 mb-3">
            <div class="form-check" th:each="s : ${subclasses}">
                <input class="form-check-input" type="radio" name="subclassId" th:value="${s.id}" th:id="${s.id}"/>
                <label class="form-check-label" th:for="${s.id}" th:text="${s.name}">Subclass name</label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Confirm</button>

    </form>

</div>

</body>
</html>
