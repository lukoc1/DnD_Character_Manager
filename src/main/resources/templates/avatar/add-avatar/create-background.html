<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>DnD Character Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<!-- TOP NAVBAR -->
<nav th:replace="fragments/header :: header"></nav>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 m-0">
            <span th:text="${avatar.name}">Hero</span> &mdash;
            <span th:text="${background.name}">Acolyte</span>
        </h1>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}">error</div>

    <form th:action="@{/avatar/{id}/create/background(id=${avatar.id})}" method="post">

        <!-- what the background gives (read-only) -->
        <div class="border border-2 border-dark rounded-3 p-3 mb-3">
            <div class="row g-2">
                <div class="col-md-6">
                    <div class="small text-uppercase text-secondary">Origin feat</div>
                    <div class="fw-bold" th:text="${background.getBenefit('feat')?.description} ?: '-'">Magic Initiate (Cleric)</div>
                </div>
                <div class="col-md-6">
                    <div class="small text-uppercase text-secondary">Skill proficiencies</div>
                    <div class="fw-bold" th:text="${background.getBenefit('skill_proficiency')?.description} ?: '-'">Insight and Religion</div>
                </div>
            </div>
        </div>

        <!-- ability score increase -->
        <div class="border border-2 border-dark rounded-3 p-3 mb-3">
            <div class="small text-uppercase text-secondary mb-2">
                Ability score increase &mdash;
                <span th:text="${#strings.listJoin(background.abilityScoreOptions, ', ')}">Intelligence, Wisdom, Charisma</span>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="abilityMode" value="split" id="mode-split" checked/>
                <label class="form-check-label" for="mode-split">Raise one by +2 and another by +1</label>
            </div>
            <div class="row g-2 my-1 ps-4">
                <div class="col-sm-6">
                    <label class="small text-secondary" for="plus2">+2 to</label>
                    <select class="form-select" name="plus2" id="plus2">
                        <option value="">-</option>
                        <option th:each="a : ${background.abilityScoreOptions}" th:value="${a}" th:text="${a}">Intelligence</option>
                    </select>
                </div>
                <div class="col-sm-6">
                    <label class="small text-secondary" for="plus1">+1 to</label>
                    <select class="form-select" name="plus1" id="plus1">
                        <option value="">-</option>
                        <option th:each="a : ${background.abilityScoreOptions}" th:value="${a}" th:text="${a}">Wisdom</option>
                    </select>
                </div>
            </div>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="abilityMode" value="all" id="mode-all"/>
                <label class="form-check-label" for="mode-all">Raise all three by +1</label>
            </div>
        </div>

        <!-- starting equipment (choose A or B) -->
        <div class="border border-2 border-dark rounded-3 p-3 mb-3">
            <div class="small text-uppercase text-secondary mb-2">Starting equipment</div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="equipment" value="A" id="eq-a" checked/>
                <label class="form-check-label" for="eq-a">
                    <strong>A.</strong> <span th:text="${background.equipmentOptionA}">... 8 GP</span>
                </label>
            </div>
            <div class="form-check" th:if="${background.equipmentOptionB != null}">
                <input class="form-check-input" type="radio" name="equipment" value="B" id="eq-b"/>
                <label class="form-check-label" for="eq-b">
                    <strong>B.</strong> <span th:text="${background.equipmentOptionB}">50 GP</span>
                </label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Finish</button>

    </form>

</div>

</body>
</html>
