<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>DnD Character Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<!-- TOP NAVBAR -->
<nav class="navbar navbar-light mb-2" style="background-color: #B0BE00;" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand text-black" th:href="@{/login}">DnD Character Manager</a>
    </div>
</nav>


<div class="container">

    <div class="d-flex justify-content-between align-items-right mb-3">
        <h1 class="h3 m-0">New avatar</h1>
    </div>

    <form th:action="@{/avatar/add}" th:object="${avatarDTO}" method="post">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" th:field="*{name}"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Background</label>
            <input type="text" class="form-control" th:field="*{background}"/>
        </div>
        <div class="mb-3">
            <label class="form-label">Class</label>

            <select class="form-select" th:field="*{dndClassId}">
                <option value="">-- choose class --</option>

                <!-- klasy grywalne -->
                <option th:each="c : ${dndClasses}"
                        th:if="${c.apiIndex == 'barbarian' or c.apiIndex == 'wizard'}"
                        th:value="${c.id}"
                        th:text="${c.name}"></option>

                <!-- klasy jeszcze nie wprowadzone -->
                <option th:each="c : ${dndClasses}"
                        th:if="${c.apiIndex != 'barbarian' and c.apiIndex != 'wizard'}"
                        th:value="${c.id}"
                        th:text="${c.name + ' (soon)'}"
                        disabled></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('dndClassId')}" th:errors="*{dndClassId}"></div>
        </div>

        <button type="submit" name="save" class="btn btn-primary">Save</button>
        <button type="submit" name="cancel" class="btn btn-primary">Cancel</button>

    </form>

</div>

</body>
</html>
