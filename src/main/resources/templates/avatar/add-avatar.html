<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>DnD Character Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<!-- TOP NAVBAR -->
<nav th:replace="fragments/header :: header"></nav>


<div class="container">

    <div class="d-flex justify-content-between align-items-right mb-3">
        <h1 class="h3 m-0">New avatar</h1>
    </div>

    <form th:action="@{/avatar/add}" th:object="${avatarDTO}" method="post">

        <!--BASICS + LVL + ARMOR + HIT POINTS-->
        <div class="d-flex flex-wrap gap-3 mb-2">

            <!-- Blok 1 -->
            <div class="border border-2 border-dark rounded-3 px-3 py-2 flex-fill" style="min-width: 320px;">

                <!-- wiersz 1: character name -->
                <div class="row g-0">
                    <div class="col px-2 py-1">
                        <div class="fs-5 fw-bold border-bottom border-dark">
                            <input type="text" class="form-control" th:field="*{name}"/>
                        </div>
                        <div class="small text-uppercase text-secondary">Character name</div>
                    </div>
                </div>

                <!-- wiersz 2: background + class -->
                <div class="row g-0">

                    <div class="col px-2 py-1">
                        <div class="fs-5 fw-bold border-bottom border-dark">
                            <select class="form-select" aria-label="Default select example" th:field="*{backgroundId}">
                                <option value="" selected>-- choose background --</option>

                                <option th:each="b : ${backgrounds}"
                                        th:value="${b.id}"
                                        th:text="${b.name}"></option>

                                <!--                bacgroundy nie wprowadzone jeszcze-->
                                <!--                <option th:each="c : ${dndClasses}"-->
                                <!--                        th:if="${c.apiIndex != 'barbarian' and c.apiIndex != 'wizard'}"-->
                                <!--                        th:value="${c.id}"-->
                                <!--                        th:text="${c.name + ' (soon)'}"-->
                                <!--                        disabled></option>-->

                            </select>

                        </div>
                        <div class="small text-uppercase text-secondary">Background</div>
                    </div>

                    <div class="col px-2 py-1">
                        <div class="fs-5 fw-bold border-bottom border-dark">
                            <select class="form-select" th:field="*{dndClassId}">
                                <option value="">-- choose class --</option>

                                <!-- klasy grywalne -->
                                <option th:each="c : ${dndClasses}"
                                        th:if="${c.apiIndex == 'barbarian' or c.apiIndex == 'wizard'}"
                                        th:value="${c.id}"
                                        th:text="${c.name}"></option>

                                <!-- klasy jeszcze nie wprowadzone -->
                                <option th:each="c : ${dndClasses}"
                                        th:if="${c.apiIndex != 'barbarian' and c.apiIndex != 'wizard'}"
                                        th:value="${c.id}"
                                        th:text="${c.name + ' (soon)'}"
                                        disabled></option>
                            </select>
                        </div>
                        <div class="small text-uppercase text-secondary">Class</div>
                    </div>
                </div>

                <!-- wiersz 3: species + subclass -->
                <div class="row g-0">
                    <div class="col px-2 py-1">
                        <div class="fs-5 fw-bold border-bottom border-dark">
                            <select class="form-select" th:field="*{specieId}">
                                <option value="">-- choose specie --</option>

                                <option th:each="s : ${species}"
                                        th:value="${s.id}"
                                        th:text="${s.name}"></option>
                            </select>
                        </div>
                        <div class="small text-uppercase text-secondary">Species</div>
                    </div>
                    <div class="col px-2 py-1">
                        <div class="fs-5 fw-bold border-bottom border-dark">-</div>
                        <div class="small text-uppercase text-secondary">Subclass (3rd level needed)</div>
                    </div>
                </div>

            </div>

        </div>

        <button type="submit" name="save" class="btn btn-primary">Save</button>
        <button type="submit" name="cancel" class="btn btn-primary">Cancel</button>

    </form>

</div>


</body>
</html>
