<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DnD Character Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

</head>
<body>

<!-- TOP NAVBAR -->
<nav th:replace="fragments/header :: header"></nav>

<div class="container">
    <!--  <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">-->
    <!--    <span th:text="${message}">Operacja zakończona sukcesem.</span>-->
    <!--    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Zamknij"></button>-->
    <!--  </div>-->

    <div class="d-flex justify-content-between align-items-center mb-3">


        <h1 class="h3 m-0" th:text="${avatar.name}">Selected avatar</h1>

        <div>
            <a class="btn btn-success" th:href="@{|/avatar/select/${avatar.id}/showcard|}">
                <i class="bi bi-eye"></i> Show card
            </a>
            <a class="btn btn-success" th:href="@{/home}">
                Back
            </a>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Class</th>
                <th>Subclass</th>
                <th>Background</th>
                <th>Level</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td th:text="${avatar.className}"></td>
                <td th:text="${avatar.subclassName != null ? avatar.subclassName : '-'}"></td>
                <td th:text="${avatar.backgroundName}"></td>
                <td th:text="${avatar.level}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
