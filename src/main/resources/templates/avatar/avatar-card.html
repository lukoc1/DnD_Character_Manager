<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DnD Character Sheet</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<!-- TOP NAVBAR-->
<nav th:replace="fragments/header :: header"></nav>


<div class="slider">

    <div class="container mb-5">

        <!-- NAGŁÓWEK POSTACI -->
        <div class="card shadow-sm mb-2">
            <div class="card-body">
                <div class="row g-3">
                    <div th:replace="~{fragments/card-textbox :: card-textbox(title='Character name', value=${avatar.name}, valueClass='fs-2')}"></div>
                    <div th:replace="~{fragments/card-textbox :: card-textbox(title='Background', value=${avatar.backgroundName})}"></div>
                    <div th:replace="~{fragments/card-textbox :: card-textbox(title='Class', value=${avatar.className})}"></div>
                    <div th:replace="~{fragments/card-textbox :: card-textbox(title='Species', value=${avatar.specieName})}"></div>
                    <div th:replace="~{fragments/card-textbox :: card-textbox(title='Subclass', value=${avatar.subclassName} ?: '-')}"></div>
                </div>
            </div>
        </div>

        <!-- NAGŁÓWEK POSTACI -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div th:replace="~{fragments/card-textbox :: card-textbox(title='Level', value=${avatar.level})}"></div>
                    <div th:replace="~{fragments/card-textbox :: card-textbox(title='Armor class', value=${avatar.level})}"></div>
                    <div th:replace="~{fragments/card-textbox :: card-textbox(title='Hitpoints', value=${avatar.level})}"></div>
<!--                    current temp and max-->
                    <div th:replace="~{fragments/card-textbox :: card-textbox(title='Hit Dice', value=${avatar.level})}"></div>
                    <div th:replace="~{fragments/card-textbox :: card-textbox(title='Death saves', value=${avatar.level})}"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mb-5">
        <!-- NAGŁÓWEK POSTACI -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label text-muted mb-0">Nazwa Postaci 2</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<div class="container d-flex justify-content-center mt-3">
    <button class="bi bi-arrow-left" type="button" id="prevPage">
        <span>Previous</span>
    </button>

    <button class="bi-arrow-right" type="button" id="nextPage">
        <span>Next</span>
    </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/cardSheet.js}"></script>
</body>
</html>
