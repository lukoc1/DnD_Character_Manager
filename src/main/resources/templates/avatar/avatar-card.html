<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>DnD Character Sheet</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>

<!-- TOP NAVBAR -->
<nav class="navbar navbar-light mb-2" style="background-color: #B0BE00;" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand text-black" th:href="@{/login}">DnD Character Sheet</a>
        <a th:href="@{|/avatar/select/${avatar.id}}" class="btn btn-outline-light btn-sm">Back</a>
    </div>
</nav>

<!--<nav class="navbar navbar-dark bg-primary mb-4">-->
<!--    <div class="container d-flex justify-content-between">-->
<!--        <a class="navbar-brand fw-bold" th:href="@{/home}">D&D Character Sheet</a>-->
<!--        <a th:href="@{|/avatar/select/${avatar.id}}" class="btn btn-outline-light btn-sm">Back</a>-->
<!--    </div>-->
<!--</nav>-->

<div class="slider">

    <div class="container mb-5">

        <!-- NAGŁÓWEK POSTACI -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label text-muted mb-0">Nazwa Postaci 1</label>
                        <h2 class="m-0 fw-bold" th:text="${avatar.name}">Hero Name</h2>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-muted mb-0">Klasa & Poziom</label>
                        <div class="fw-bold" th:text="${avatar.className != null ? avatar.className : 'Brak'}">Fighter 1</div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-muted mb-0">Rasa / Species</label>
                        <div class="fw-bold" th:text="${avatar.species != null ? avatar.species : 'Human'}">Human</div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-muted mb-0">Podklasa</label>
                        <div class="fw-bold" th:text="${avatar.subclassName != null ? avatar.subclassName : '-'}">-</div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-muted mb-0">Tło (Background)</label>
                        <div class="fw-bold" th:text="${avatar.background != null ? avatar.background : 'Soldier'}">Soldier</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mb-5">
        <!-- NAGŁÓWEK POSTACI -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label text-muted mb-0">Nazwa Postaci 2</label>
                        <h2 class="m-0 fw-bold" th:text="${avatar.name}">Hero Name</h2>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-muted mb-0">Klasa & Poziom</label>
                        <div class="fw-bold" th:text="${avatar.className != null ? avatar.className : 'Brak'}">Fighter 1</div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-muted mb-0">Rasa / Species</label>
                        <div class="fw-bold" th:text="${avatar.species != null ? avatar.species : 'Human'}">Human</div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-muted mb-0">Podklasa</label>
                        <div class="fw-bold" th:text="${avatar.subclassName != null ? avatar.subclassName : '-'}">-</div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label text-muted mb-0">Tło (Background)</label>
                        <div class="fw-bold" th:text="${avatar.background != null ? avatar.background : 'Soldier'}">Soldier</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>


<div class="container d-flex justify-content-center mt-3">
    <button class="bi bi-arrow-left" type="button" id="prevPage">
        <span>Previous</span>
    </button>

    <button class="bi-arrow-right" type="button" id="nextPage">
        <span>Next</span>
    </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/cardSheet.js}"></script>
</body>
</html>
