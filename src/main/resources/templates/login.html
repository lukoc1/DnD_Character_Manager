<!DOCTYPE HTML>
<html xmlns:th="https://www.thymeleaf.org">
<head>
    <title>DnD Character Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>


<!-- TOP NAVBAR -->
<nav th:replace="fragments/header :: header"></nav>


<div class="container">

    <div th:if="${param.error}" class="alert alert-danger" role="alert">
        Wrong login or password!
    </div>
    <div th:if="${param.logout}" class="alert alert-success" role="alert">
        Logout successfully.
    </div>

    <div class="d-flex justify-content-between align-items-right mb-3">
        <h1 class="h3 m-0"> Log in</h1>
        <a class="btn btn-primary" role="button" th:href="@{/user/register}">
            <i class="bi bi-plus-lg"></i> Register new user
        </a>
    </div>

    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" aria-describedby="emailHelp" name="username" required />
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" required />
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>

    </form>

</div>


</body>
</html>
